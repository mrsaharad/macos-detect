id: MD-0031
title: Existing shell profile modified
title_th: แก้ไฟล์ตั้งค่า shell ที่มีอยู่แล้ว (เช่น ต่อท้าย .zshrc)
status: experimental
description: An existing shell startup file was changed. MD-0014 only sees new files; appending a line to an existing .zshrc is the common persistence method.
plain_th: มีการแก้ไฟล์ที่ shell อ่านทุกครั้งที่เปิด Terminal ผู้โจมตีใช้ฝังคำสั่งให้รันซ้ำ
author: Saharad
version: v2
tags:
- attack.persistence
- attack.t1546.004
logsource:
  product: macos
  category: file_modify
detection:
  selection:
    TargetFilename|endswith:
    - /.zshrc
    - /.zshenv
    - /.zprofile
    - /.zlogin
    - /.bash_profile
    - /.bashrc
    - /.profile
  condition: selection
falsepositives:
- ผู้ใช้แก้ไฟล์ตั้งค่าเอง หรือตัวติดตั้ง เช่น Homebrew, conda เพิ่ม PATH
level: low
