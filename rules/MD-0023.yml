id: MD-0023
title: Local user accounts listed
title_th: สำรวจรายชื่อบัญชีผู้ใช้ (dscl / dscacheutil)
status: experimental
description: All local user accounts were enumerated.
plain_th: มีการดูรายชื่อบัญชีผู้ใช้ในเครื่อง
author: Saharad
tags:
- attack.discovery
- attack.t1087.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith:
    - /dscl
    - /dscacheutil
    CommandLine|contains:
    - list /Users
    - -q user
    - read /Groups/admin
  condition: selection
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: low
