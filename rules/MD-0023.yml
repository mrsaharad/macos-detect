id: MD-0023
title: Local user accounts listed
title_th: สำรวจรายชื่อบัญชีผู้ใช้ (dscl / dscacheutil)
status: experimental
description: All local user accounts were enumerated.
plain_th: มีการดูรายชื่อบัญชีผู้ใช้ในเครื่อง
author: Saharad
tags:
- attack.discovery
- attack.t1087.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith:
    - /dscl
    - /dscacheutil
    CommandLine|contains:
    - list /Users
    - -q user
    - read /Groups/admin
  # ปรับจากผล Atomic T1087.001 (dev): อ่านรายชื่อบัญชี / สิทธิ์ sudo จากไฟล์ระบบโดยตรง
  selection_files:
    Image|endswith:
    - /cat
    - /grep
    - /egrep
    - /head
    - /tail
    - /less
    - /more
    - /awk
    CommandLine|contains:
    - /etc/sudoers
    - /etc/passwd
  condition: 1 of selection*
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: low
