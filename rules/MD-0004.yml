id: MD-0004
title: Fake password prompt
title_th: หน้าต่างหลอกถามรหัสผ่านผ่าน osascript
status: experimental
description: A script opened a dialog asking for a password, a common trick to steal credentials.
plain_th: มีสคริปต์เปิดหน้าต่างถามรหัสผ่านปลอม เพื่อหลอกให้ผู้ใช้พิมพ์รหัส
author: Saharad
tags:
- attack.credential_access
- attack.t1056.002
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /osascript
    CommandLine|contains|all:
    - display dialog
    - password
  condition: selection
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: high
