id: MD-0021
title: Firewall disabled
title_th: ปิดไฟร์วอลล์ของ macOS
status: experimental
description: The macOS firewall was turned off.
plain_th: มีการปิดไฟร์วอลล์ของเครื่อง
author: Saharad
tags:
- attack.defense_impairment
- attack.t1562.004
logsource:
  product: macos
  category: process_creation
detection:
  selection_app:
    Image|endswith: /socketfilterfw
    CommandLine|contains: --setglobalstate off
  selection_pf:
    Image|endswith: /pfctl
    CommandLine|contains: ' -d'
  condition: 1 of selection_*
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: high
