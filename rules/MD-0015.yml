id: MD-0015
title: Login item added
title_th: เพิ่ม Login Item ผ่าน osascript
status: experimental
description: A script added a program that opens automatically at login.
plain_th: มีสคริปต์เพิ่มโปรแกรมให้เปิดเองตอนล็อกอิน
author: Saharad
tags:
- attack.persistence
- attack.t1547.015
logsource:
  product: macos
  category: process_creation
detection:
