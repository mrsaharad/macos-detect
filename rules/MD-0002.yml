id: MD-0002
title: Keychain password lookup
title_th: ค้นรหัสผ่านใน Keychain ด้วย security find-*-password
status: experimental
description: The security tool read a saved password from the Keychain, launched outside system processes.
plain_th: มีการค้นหารหัสผ่านที่บันทึกไว้ใน Keychain ผ่านคำสั่ง security
author: Saharad
tags:
- attack.credential_access
- attack.t1555.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /security
  # v2: ใช้ลายเซ็นด้วย จับสำเนาที่เปลี่ยนชื่อแต่ยังอ้าง identifier ของ Apple
  selection_signing:
    SigningId: com.apple.security
  command:
    CommandLine|contains:
    - find-generic-password
    - find-internet-password
  filter_system:
    ParentImage|startswith:
    - /System/
    - /usr/libexec/
  condition: 1 of selection* and command and not filter_system
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: medium
