id: MD-0006
title: AppleScript run from command line
title_th: รัน AppleScript จากบรรทัดคำสั่ง (osascript -e)
status: experimental
description: osascript ran an inline script. Attackers use this to control other apps.
plain_th: มีการสั่งรันสคริปต์ AppleScript ผ่าน Terminal ซึ่งผู้โจมตีนิยมใช้ควบคุมแอปอื่น
author: Saharad
tags:
- attack.execution
- attack.t1059.002
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /osascript
    CommandLine|contains: ' -e '
  # v2: จากผล evasion ชุด dev — รันไฟล์สคริปต์แทน -e (ET-OSA-2) และใช้สำเนาที่เปลี่ยนชื่อ (ET-OSA-1)
  # osascript เก็บ identifier ไว้ใน Info.plist สำเนาที่เซ็นใหม่จึงยังเป็น com.apple.osascript
  selection_file:
    Image|endswith: /osascript
    CommandLine|re: '\s\S+\.(scpt|scptd|applescript|js)(\s|$)'
  selection_signing:
    SigningId: com.apple.osascript
    CommandLine|contains: ' -e '
  filter_system:
    ParentImage|startswith:
    - /System/
    - /usr/libexec/
  condition: 1 of selection* and not filter_system
falsepositives:
- สคริปต์อัตโนมัติของผู้ใช้
level: medium
