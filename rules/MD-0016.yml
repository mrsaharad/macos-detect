id: MD-0016
title: File hidden from Finder
title_th: ซ่อนไฟล์ด้วย chflags hidden
status: experimental
description: A file was flagged hidden, so it no longer shows in Finder.
plain_th: มีการตั้งค่าให้ไฟล์ถูกซ่อนจาก Finder
author: Saharad
tags:
- attack.stealth
- attack.t1564.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /chflags
    CommandLine|contains: hidden
  # ปรับจากผล Atomic T1564.001 (dev): ตั้ง Finder ให้แสดงไฟล์ซ่อน
  selection_finder:
    Image|endswith: /defaults
    # จับเฉพาะการ "เปิด" แสดงไฟล์ซ่อน (YES/TRUE/1) ไม่จับการปิดคืน
    CommandLine|re: 'write\s+com\.apple\.finder\s+AppleShowAllFiles\s+(-bool\s+)?(YES|TRUE|1)\b'
  condition: 1 of selection*
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: medium
