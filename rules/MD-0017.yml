id: MD-0017
title: Quarantine flag removed
title_th: ลบป้ายกักกัน (quarantine) ของไฟล์ที่ดาวน์โหลด
status: experimental
description: The quarantine flag was removed from a downloaded file, so Gatekeeper will not check it.
plain_th: มีการลบป้ายที่ทำให้ Gatekeeper ตรวจไฟล์ดาวน์โหลด เพื่อให้เปิดได้โดยไม่ถูกเตือน
author: Saharad
tags:
- attack.stealth
- attack.t1553.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /xattr
    CommandLine|contains: com.apple.quarantine
  action:
    CommandLine|contains:
    - ' -d '
    - ' -c'
    - ' -r'
  condition: selection and action
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: high
