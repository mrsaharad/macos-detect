id: MD-0024
title: Installed software listed
title_th: สำรวจโปรแกรมที่ติดตั้ง
status: experimental
description: Installed applications were listed, often to find security tools.
plain_th: มีการดูรายชื่อแอปที่ติดตั้ง ผู้โจมตีใช้หาว่ามีโปรแกรมป้องกันอะไรบ้าง
author: Saharad
tags:
- attack.discovery
- attack.t1518
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: /system_profiler
    CommandLine|contains: SPApplicationsDataType
  # ปรับจากผล Atomic T1518.001 (dev): ค้นหาโปรเซสของซอฟต์แวร์ความปลอดภัย
  selection_secsw:
    Image|endswith:
    - /grep
    - /egrep
    - /pgrep
    CommandLine|contains:
    - Little Snitch
    - LittleSnitch
    - falcond
    - santad
    - CbOsxSensorService
    - CbDefense
    - osqueryd
    - BlockBlock
    - LuLu
  condition: 1 of selection*
falsepositives:
- การใช้งานปกติของผู้ดูแลระบบ
level: low
