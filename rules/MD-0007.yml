id: MD-0007
title: Internet script piped to shell
title_th: ดาวน์โหลดสคริปต์แล้วส่งให้ shell รันทันที (curl | sh)
status: experimental
description: A script was downloaded and executed immediately without being saved or reviewed.
plain_th: มีการโหลดสคริปต์จากอินเทอร์เน็ตแล้วรันทันทีโดยไม่ตรวจก่อน
author: Saharad
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith:
    - /sh
    - /bash
    - /zsh
    CommandLine|contains:
    - 'curl '
    - 'wget '
  pipe:
    CommandLine|contains:
    - '| sh'
    - '|sh'
    - '| bash'
    - '|bash'
    - '| zsh'
    - '|zsh'
  # ปรับจากผล Atomic T1059.004 (dev): รันสคริปต์จาก /tmp และ shell ที่ถูกเปิดจาก awk
  tmp_script:
    Image|endswith:
    - /sh
    - /bash
    - /zsh
    CommandLine|re: '^(\S*/)?(ba|z)?sh (/private)?/tmp/\S+'
  awk_shell:
    ParentImage|endswith: /awk
    Image|endswith:
    - /sh
    - /bash
    - /zsh
  # ตัวติดตั้งแพ็กเกจ (.pkg) ของ macOS รันสคริปต์ติดตั้งจาก /tmp/PKInstallSandbox.* ตามปกติ (พบจริงตอนติดตั้ง PowerShell)
  filter_installer:
  - ParentImage|endswith: /package_script_service
  - CommandLine|contains: /PKInstallSandbox.
  condition: ((selection and pipe) or tmp_script or awk_shell) and not filter_installer
falsepositives:
- สคริปต์ติดตั้งโปรแกรมที่เชื่อถือได้ เช่น Homebrew
level: high
